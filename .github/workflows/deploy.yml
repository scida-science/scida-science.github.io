name: Build and deploy SciDA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run frontend and service tests
        run: npm test
      - name: Check backend types
        run: npm run check:backend
      - name: Package Worker without deploying
        run: npm run build:backend
      - name: Test packaged Worker runtime
        run: npm run test:worker
      - name: Build website
        env:
          VITE_SCIDA_API_URL: ${{ vars.VITE_SCIDA_API_URL }}
        run: |
          if [ -z "$VITE_SCIDA_API_URL" ]; then
            echo "::warning::The GitHub backend is not configured. Public illustrative discoveries remain available; account services are unavailable."
          fi
          npm run build
      - name: Verify configured API before publishing
        if: github.event_name != 'pull_request' && vars.VITE_SCIDA_API_URL != ''
        env:
          SCIDA_API_URL: ${{ vars.VITE_SCIDA_API_URL }}
        run: node scripts/verify-live.mjs --require-configured
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
